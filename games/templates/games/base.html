<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}GameVault{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #1f2937;
        }

        nav a {
            color: #f9fafb;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: min(1100px, 90%);
            margin: 40px auto;
        }

        .card {
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            background: #7f1d1d;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<nav>
    <div>
        <strong>🎮 GameVault</strong>
    </div>

    <div>
        {% if user.is_authenticated %}
    <span>Hello, {{ user.username }}</span>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'library' %}">My Library</a>
    <a href="{% url 'add_game' %}">Add Game</a>
    <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</nav>

<div class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
